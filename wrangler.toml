name = "wellkeep"
main = "web/src/worker.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "web/public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Rate limits for /api/*: exact counters in one Durable Object (see Limiter in web/src/worker.js).
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]

[vars]
POOL_ID = "0se442fd5f33732a4fc919dbdc4b24589990ac9e5d"
RELAY_ID = "bh-relay.testnet"
RPC_URL = "https://test.rpc.fastnear.com"
