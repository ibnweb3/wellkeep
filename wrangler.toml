name = "wellkeep"
main = "web/src/worker.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "web/public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Rate limits for /api/*: exact counters in one Durable Object (see Limiter in web/src/worker.js).
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]

# Every ten minutes the relayer returns the test USDC the sandbox paid it back to the shared pool (see recycle in worker.js).
[triggers]
crons = ["*/10 * * * *"]

[vars]
POOL_ID = "0sce7733280262383cafd796e19b8ea0dc2bc2de56"
RELAY_ID = "bh-relay.testnet"
TOKEN_ID = "3e2210e1184b45b64c8a434c0a7e7b23cc04ea7eb7a6c3c32520d03d4afcb8af"
RPC_URL = "https://test.rpc.fastnear.com"
