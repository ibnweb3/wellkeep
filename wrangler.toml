name = "wellkeep"
main = "web/src/worker.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "web/public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Rate limits for /api/*: per caller IP and for all callers together (Cloudflare Rate Limiting bindings).
# A full repair through the Try page is about 9 requests, so 30 a minute per caller is comfortable for a person.
[[ratelimits]]
name = "PER_IP"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "ALL_CALLERS"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 120
  period = 60

[vars]
POOL_ID = "0se442fd5f33732a4fc919dbdc4b24589990ac9e5d"
RELAY_ID = "bh-relay.testnet"
RPC_URL = "https://test.rpc.fastnear.com"
